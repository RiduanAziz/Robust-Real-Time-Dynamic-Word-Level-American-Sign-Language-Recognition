      - Benchmark Protocol: research/REALTIME_BENCHMARK.md
      - Local Development: LOCAL_DEVELOPMENT.md
      - Local Integration: LOCAL_INTEGRATION_GUIDE.md
  - Research & Thesis Defense:
      - Final Project Report: INTERNSHIP_FINAL_PROJECT_REPORT.md
      - Project Defense & Viva Guide: PROJECT_DEFENSE_AND_VIVA_GUIDE.md
      - Thesis Results & Limitations: THESIS_RESULTS_AND_LIMITATIONS.md
      - Thesis Evidence Package: THESIS_EVIDENCE_PACKAGE.md
