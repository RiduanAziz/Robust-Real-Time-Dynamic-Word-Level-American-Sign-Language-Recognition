services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: signflow-api
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - PYTHONPATH=/app/src
      - SIGNFLOW_DEVICE=cpu
      - SIGNFLOW_MODEL_SET=ensemble_3way
      - SIGNFLOW_MAX_CONNECTIONS=50
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/live\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: unless-stopped
