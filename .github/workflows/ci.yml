name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-backend:
    name: Python Backend Verification & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[test]"
      - name: Syntax and bytecode compilation
        run: |
          python -m compileall src scripts tests
      - name: Syntax and import verification
        run: |
          python -c "import sign_language; print('Package import OK')"
          python scripts/train.py --help
          python scripts/evaluate.py --help
          python scripts/evaluate_robustness.py --help
          python scripts/prepare_dataset.py --help
          python scripts/split_dataset.py --help
      - name: Configuration dry-run
        run: |
          python scripts/train.py --dry-run --config configs/base.yaml
      - name: Run unit test suite
        run: |
          pytest -q

  frontend:
    name: React Frontend Verification & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'app/frontend/package-lock.json'
      - name: Install frontend dependencies
        run: |
          cd app/frontend
          npm ci
      - name: Run frontend unit tests
        run: |
          cd app/frontend
          npm test -- --run
      - name: Build production bundle
        run: |
          cd app/frontend
          npm run build

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [python-backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker container image
        run: |
          docker build -t signflow:ci .
      - name: Run container liveness smoke test
        run: |
          docker run -d --name signflow-smoke -p 8000:8000 -e PORT=8000 signflow:ci
          sleep 5
          curl --fail --retry 10 --retry-delay 2 --retry-connrefused http://localhost:8000/health/live
          docker logs signflow-smoke
          docker stop signflow-smoke
