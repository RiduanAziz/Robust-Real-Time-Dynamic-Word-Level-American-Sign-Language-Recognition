name: Training Validation

on:
  workflow_dispatch:

jobs:
  smoke-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - run: python scripts/train.py --config configs/base.yaml
